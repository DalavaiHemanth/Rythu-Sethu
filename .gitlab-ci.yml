# GitLab CI/CD Pipeline Configuration for Rythu Sethu
# -----------------------------------------------------
# This pipeline automates quality checks, linting, and deploys the application 
# directly to GitLab's built-in static web hosting (GitLab Pages).
# 
# 🔐 SECURE BINDING: This requires NO Google Cloud service accounts, key JSON files, 
# or container registries. It runs 100% free with only your GEMINI_API_KEY config.
#
# Optional: To bake your GEMINI_API_KEY directly into the build, define a GitLab
# CI/CD Variable named `GEMINI_API_KEY` in: Settings -> CI/CD -> Variables.
# Otherwise, users can enter their key securely inside the application UI!

stages:
  - quality
  - deploy

# ---------------------------------------------------------------------------
# Stage 1: Quality (Type-checking and Linting)
# ---------------------------------------------------------------------------
typecheck-and-lint:
  stage: quality
  image: node:20-alpine
  cache:
    key: "rythu-sethu-deps"
    paths:
      - .npm/
  before_script:
    - echo "Installing dependencies..."
    - npm install --no-audit --no-fund --cache .npm --prefer-offline
  script:
    # Run the type-checker script
    - npm run lint

# ---------------------------------------------------------------------------
# Stage 2: GitLab Pages Deploy (Direct Serverless Static Hosting)
# ---------------------------------------------------------------------------
pages:
  stage: deploy
  image: node:20-alpine
  cache:
    key: "rythu-sethu-deps"
    paths:
      - .npm/
  before_script:
    - npm install --no-audit --no-fund --cache .npm --prefer-offline
  script:
    - echo "Building static front-end assets..."
    # If the user defined a GEMINI_API_KEY environment variable in GitLab Settings,
    # we copy it to VITE_GEMINI_API_KEY so Vite bakes it into the build.
    - if [ -n "$GEMINI_API_KEY" ]; then export VITE_GEMINI_API_KEY="$GEMINI_API_KEY"; fi
    - npm run build
    # GitLab Pages strictly expects the folder containing static files to be named 'public'
    - rm -rf public
    - mkdir public
    - cp -r dist/* public/
  artifacts:
    paths:
      - public
  rules:
    # Build & deploy to Pages whenever a push happens on the default branch (e.g. main/master)
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
