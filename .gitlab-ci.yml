#         --image=$IMAGE_TAG 
#         --platform=managed 
#         --region=$GCP_REGION 
#         --allow-unauthenticated
#         --port=3000
#         --set-env-vars="GEMINI_API_KEY=$GEMINI_API_KEY,NODE_ENV=production"

# OPTION B: Deploy to Virtual Private Server (VPS / Ubuntu) via SSH
# To use this: Define variables `SSH_KEY_PRIVATE`, `SERVER_IP`, and `SERVER_USER` in GitLab Settings
 deploy-ssh-vps:
   stage: deploy
   image: alpine:latest
   rules:
     - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
   before_script:
     - apk add --no-cache openssh-client
     - eval $(ssh-agent -s)
     - echo "$SSH_KEY_PRIVATE" | tr -d '\r' | ssh-add -
     - mkdir -p ~/.ssh
     - chmod 700 ~/.ssh
     - ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts
     - chmod 644 ~/.ssh/known_hosts
   script:
     # SSH into server, pull latest image from GitLab Registry, stop stale container, and boot new one on Port 3000 securely
     - >
       ssh $SERVER_USER@$SERVER_IP "
         echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin $CI_REGISTRY &&
         docker pull $IMAGE_TAG &&
         docker stop rythu-sethu-live || true &&
         docker rm rythu-sethu-live || true &&
         docker run -d 
           --name rythu-sethu-live 
           -p 3000:3000 
           -e GEMINI_API_KEY='$GEMINI_API_KEY' 
           -e NODE_ENV='production' 
           --restart unless-stopped 
           $IMAGE_TAG
       "
