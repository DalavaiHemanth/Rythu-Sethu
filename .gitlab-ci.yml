# GitLab CI/CD Pipeline Configuration for Rythu Sethu
# -----------------------------------------------------
# This pipeline automates quality checks, linting, Docker image compilation, 
# and provides templates for multi-destination deployment.

stages:
  - quality
  - build
  - deploy

variables:
  # Enable Docker-in-Docker build caching
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  # Name of the built Docker image using GitLab's built-in container registry
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  IMAGE_TAG_LATEST: "$CI_REGISTRY_IMAGE:latest"

# ---------------------------------------------------------------------------
# Stage 1: Quality (Type-checking and Linting)
# ---------------------------------------------------------------------------
typecheck-and-lint:
  stage: quality
  image: node:20-alpine
  cache:
    key: "rythu-sethu-deps"
    paths:
      - .npm/
  before_script:
    - echo "Installing dependencies..."
    - npm install --no-audit --no-fund --cache .npm --prefer-offline
  script:
    # Run the type-checker script
    - npm run lint
    # Test compilation to verify there are no esbuild or bundling errors
    - npm run build

# ---------------------------------------------------------------------------
# Stage 2: Containerization (Build & push to GitLab Container Registry)
# ---------------------------------------------------------------------------
build-image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  rules:
    # Only build and push the container image on the default branch (e.g. main/master) or merge requests
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    # Login to GitLab's built-in Container Registry
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    # Build container image utilizing Docker caching
    - docker pull $IMAGE_TAG_LATEST || true
    - >
      docker build 
      --cache-from $IMAGE_TAG_LATEST 
      -t $IMAGE_TAG 
      -t $IMAGE_TAG_LATEST 
      .
    # Push image to registry
    - docker push $IMAGE_TAG
    - docker push $IMAGE_TAG_LATEST

# ---------------------------------------------------------------------------
# Stage 3: Deployment (Uncomment & configure the destination of your choice)
# ---------------------------------------------------------------------------

# OPTION A: Deploy to Google Cloud Run (Recommended for multi-lingual apps)
# To use this: Define variables `GCP_SERVICE_KEY`, `GCP_PROJECT_ID`, and `GCP_REGION` in GitLab Settings
