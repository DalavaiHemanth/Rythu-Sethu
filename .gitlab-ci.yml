# GitLab CI/CD Pipeline Configuration for Rythu Sethu
# -----------------------------------------------------
# This pipeline automates quality checks, linting, Docker image compilation, 
# and provides templates for multi-destination deployment.

stages:
  - quality
  - build
  - deploy

variables:
  # Enable Docker-in-Docker build caching
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  # Name of the built Docker image using GitLab's built-in container registry
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  IMAGE_TAG_LATEST: "$CI_REGISTRY_IMAGE:latest"

# ---------------------------------------------------------------------------
# Stage 1: Quality (Type-checking and Linting)
# ---------------------------------------------------------------------------
typecheck-and-lint:
  stage: quality
  image: node:20-alpine
  cache:
    key: "rythu-sethu-deps"
    paths:
      - .npm/
  before_script:
    - echo "Installing dependencies..."
    - npm install --no-audit --no-fund --cache .npm --prefer-offline
  script:
    # Run the type-checker script
    - npm run lint
    # Test compilation to verify there are no esbuild or bundling errors
    - npm run build

# ---------------------------------------------------------------------------
# Stage 2: Containerization (Build & push to GitLab Container Registry)
# ---------------------------------------------------------------------------
build-image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  rules:
    # Only build and push the container image on the default branch (e.g. main/master) or merge requests
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    # Login to GitLab's built-in Container Registry
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    # Build container image utilizing Docker caching
    - docker pull $IMAGE_TAG_LATEST || true
    - >
      docker build 
      --cache-from $IMAGE_TAG_LATEST 
      -t $IMAGE_TAG 
      -t $IMAGE_TAG_LATEST 
      .
    # Push image to registry
    - docker push $IMAGE_TAG
    - docker push $IMAGE_TAG_LATEST

# ---------------------------------------------------------------------------
# Stage 3: Deployment (Uncomment & configure the destination of your choice)
# ---------------------------------------------------------------------------

# OPTION A: Deploy to Google Cloud Run (Recommended for multi-lingual apps)
# Secure authentication options:
#   1. Workload Identity Federation (OIDC) - Preferred (No static key JSON files needed)
#      Variables needed: GCP_PROJECT_ID, GCP_PROJECT_NUMBER, GCP_POOL_ID, GCP_PROVIDER_ID, GCP_SERVICE_ACCOUNT, GCP_REGION
#   2. Classic Service Account JSON Key (Fallback)
#      Variables needed: GCP_SERVICE_KEY, GCP_PROJECT_ID, GCP_REGION
deploy-to-cloud-run:
  stage: deploy
  image: google/cloud-sdk:alpine
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  id_tokens:
    GCP_ID_TOKEN:
      aud: "https://iam.googleapis.com/projects/$GCP_PROJECT_NUMBER/locations/global/workloadIdentityPools/$GCP_POOL_ID/providers/$GCP_PROVIDER_ID"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($GCP_SERVICE_KEY != "" && $GCP_SERVICE_KEY != null || $GCP_POOL_ID != "" && $GCP_POOL_ID != null)'
  before_script:
    # Install docker CLI to pull/push registry images
    - apk add --no-cache docker-cli
    # Authenticate with GitLab Registry
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    # Authenticate with Google Cloud Platform
    - |
      if [ -n "$GCP_POOL_ID" ] && [ -n "$GCP_PROVIDER_ID" ] && [ -n "$GCP_PROJECT_NUMBER" ] && [ -n "$GCP_SERVICE_ACCOUNT" ]; then
        echo "Authenticating using Workload Identity Federation (OIDC)..."
        echo "${GCP_ID_TOKEN}" > /tmp/oidc_token
        # Generate the Google Cloud federated credential configuration file helper
        gcloud iam workload-identity-pools create-cred-config \
          "projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GCP_POOL_ID}/providers/${GCP_PROVIDER_ID}" \
          --service-account="${GCP_SERVICE_ACCOUNT}" \
          --output-file=/tmp/gcp_creds.json \
          --credential-source-file=/tmp/oidc_token
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_creds.json
        gcloud auth login --cred-file=/tmp/gcp_creds.json --quiet
      elif [ -n "$GCP_SERVICE_KEY" ]; then
        echo "Found GCP_SERVICE_KEY. Authenticating using static JSON service account key..."
        echo "$GCP_SERVICE_KEY" > gcloud-service-key.json
        gcloud auth activate-service-account --key-file=gcloud-service-key.json --quiet
      else
        echo "Error: Neither Workload Identity Federation OIDC variables nor GCP_SERVICE_KEY were found."
        echo "Please set up either OIDC (GCP_PROJECT_NUMBER, GCP_POOL_ID, GCP_PROVIDER_ID, GCP_SERVICE_ACCOUNT) or GCP_SERVICE_KEY in GitLab Settings."
        exit 1
      fi
    - gcloud config set project $GCP_PROJECT_ID
    # Authenticate Docker client for GCP Container Registry (GCR)
    - gcloud auth configure-docker --quiet
  script:
    # Pull the production-ready image from GitLab Registry
    - docker pull $IMAGE_TAG
    # Tag the image for Google Container Registry (GCR)
    - GCR_IMAGE="gcr.io/$GCP_PROJECT_ID/rythu-sethu:$CI_COMMIT_SHA"
    - docker tag $IMAGE_TAG $GCR_IMAGE
    # Push the image to GCP Container Registry
    - docker push $GCR_IMAGE
    # Deploy built image securely to Google Cloud Run
    - gcloud run deploy rythu-sethu 
        --image=$GCR_IMAGE 
        --platform=managed 
        --region=$GCP_REGION 
        --allow-unauthenticated
        --port=3000
        --set-env-vars="GEMINI_API_KEY=$GEMINI_API_KEY,NODE_ENV=production"

